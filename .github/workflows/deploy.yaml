---
name: Deploy

# Builds and pushes prebuilt images to GHCR when a merged pull request
# bumps the app version in config.yaml. Images are tagged
# ghcr.io/<owner>/<slug>/<arch>:<version>, matching `image:` in
# config.yaml. Then creates a GitHub release named <slug>-<version>
# with the matching CHANGELOG.md section as notes.
#
# Based on hassio-addons/workflows app-deploy.yaml (v3.0.1), without the
# dispatch to separate repository repositories.

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  information:
    name: ℹ️ Gather app information
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      architectures: ${{ steps.information.outputs.architectures }}
      build: ${{ steps.information.outputs.build }}
      description: ${{ steps.information.outputs.description }}
      exists: ${{ steps.exists.outputs.exists }}
      name: ${{ steps.information.outputs.name }}
      slug: ${{ steps.information.outputs.slug }}
      target: ${{ steps.information.outputs.target }}
      version: ${{ steps.information.outputs.version }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🚀 Run app information action
        id: information
        uses: frenck/action-addon-information@ce1377e9851cf569c29329e65fb2c57e67ca0f69 # v1.4.2
      - name: 🏗 Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔎 Check if this version is already published
        id: exists
        env:
          ARCHITECTURES: ${{ steps.information.outputs.architectures }}
          REPO_OWNER: ${{ github.repository_owner }}
          SLUG: ${{ steps.information.outputs.slug }}
          VERSION: ${{ steps.information.outputs.version }}
        run: |
          # Published only if every architecture has this version, so a
          # partly failed deploy is retried on the next run.
          exists=true
          for arch in $(echo "${ARCHITECTURES}" | jq -r '.[]'); do
            image="ghcr.io/${REPO_OWNER,,}/${SLUG}/${arch}:${VERSION}"
            if docker buildx imagetools inspect "${image}" > /dev/null 2>&1; then
              echo "Found ${image}"
            else
              echo "Missing ${image}"
              exists=false
            fi
          done
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"
          if [[ "${exists}" == "true" ]]; then
            echo "::notice ::Version ${VERSION} is already published, skipping deploy."
          fi

  deploy:
    name: 👷 Build & Deploy ${{ matrix.architecture }}
    needs: information
    if: needs.information.outputs.exists != 'true'
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.information.outputs.architectures) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: ℹ️ Compose build flags
        id: flags
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BUILD_FILE: ${{ needs.information.outputs.build }}
          REPO_OWNER: ${{ github.repository_owner }}
          SLUG: ${{ needs.information.outputs.slug }}
        run: |
          echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO_OWNER,,}/${SLUG}/${ARCHITECTURE}" >> "$GITHUB_OUTPUT"
          from=$(yq --no-colors eval ".build_from.${ARCHITECTURE}" "${BUILD_FILE}")
          echo "from=${from}" >> "$GITHUB_OUTPUT"

          # Extra build args from build.yaml (e.g. PANGOLIN_CLI_VERSION)
          {
            echo "args<<EOF"
            yq --no-colors eval \
              '.args // {} | to_entries | .[] | .key + "=" + (.value | tostring)' \
              "${BUILD_FILE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [[ "${ARCHITECTURE}" = "amd64" ]]; then
            echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
          elif [[ "${ARCHITECTURE}" = "aarch64" ]]; then
            echo "platform=linux/arm64/v8" >> "$GITHUB_OUTPUT"
          else
            echo "::error ::Could not determine platform for architecture ${ARCHITECTURE}"
            exit 1
          fi
      - name: 🏗 Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🚀 Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: |
            ${{ steps.flags.outputs.image }}:${{ needs.information.outputs.version }}
            ${{ steps.flags.outputs.image }}:latest
          # zizmor: ignore[template-injection] - path input to action, not shell-executed
          context: ${{ needs.information.outputs.target }}
          file: ${{ needs.information.outputs.target }}/Dockerfile
          platforms: ${{ steps.flags.outputs.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ needs.information.outputs.description }}
            BUILD_FROM=${{ steps.flags.outputs.from }}
            BUILD_NAME=${{ needs.information.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.information.outputs.version }}
            ${{ steps.flags.outputs.args }}

  release:
    name: 📢 Create GitHub release
    needs:
      - information
      - deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🚀 Create release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          SLUG: ${{ needs.information.outputs.slug }}
          TARGET: ${{ needs.information.outputs.target }}
          VERSION: ${{ needs.information.outputs.version }}
        run: |
          tag="${SLUG}-${VERSION}"
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "::notice ::Release ${tag} already exists."
            exit 0
          fi

          # Notes are the "## [VERSION]" section of the CHANGELOG
          notes=$(
            awk -v version="${VERSION}" '
              $0 ~ "^## \\[" version "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' "${TARGET}/CHANGELOG.md"
          )
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            notes="See ${TARGET}/CHANGELOG.md."
          fi

          gh release create "${tag}" \
            --target "${SHA}" \
            --title "${SLUG} ${VERSION}" \
            --notes "${notes}"
