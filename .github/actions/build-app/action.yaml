---
name: Build app
description: >-
  Builds the app image for one architecture on a native runner, using the
  base image from build.yaml. Shared by the CI and Deploy workflows.

inputs:
  architecture:
    description: App architecture (amd64, aarch64)
    required: true
  build-file:
    description: Path to the app's build.yaml
    required: true
  target:
    description: App folder (build context)
    required: true
  name:
    description: App name
    required: true
  description:
    description: App description
    required: true
  version:
    description: App version
    required: true
  push:
    description: Push the image
    default: "false"
  tags:
    description: Image tags to push
    default: ""

runs:
  using: composite
  steps:
    - name: 🏗 Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - name: ℹ️ Compose build flags
      id: flags
      shell: bash
      env:
        ARCHITECTURE: ${{ inputs.architecture }}
        BUILD_FILE: ${{ inputs.build-file }}
      run: |
        echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
        from=$(yq --no-colors eval ".build_from.${ARCHITECTURE}" "${BUILD_FILE}")
        echo "from=${from}" >> "$GITHUB_OUTPUT"
    # Runs on a native runner per architecture, so no platforms are set.
    - name: 🚀 Build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        context: ${{ inputs.target }}
        file: ${{ inputs.target }}/Dockerfile
        build-args: |
          BUILD_ARCH=${{ inputs.architecture }}
          BUILD_DATE=${{ steps.flags.outputs.date }}
          BUILD_DESCRIPTION=${{ inputs.description }}
          BUILD_FROM=${{ steps.flags.outputs.from }}
          BUILD_NAME=${{ inputs.name }}
          BUILD_REF=${{ github.sha }}
          BUILD_REPOSITORY=${{ github.repository }}
          BUILD_VERSION=${{ inputs.version }}
